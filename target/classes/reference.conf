pekko {
  actor {
    default-dispatcher {
      type = Dispatcher
      executor = "virtual-thread-executor"
    }
  }
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
}

actor-framework {
  critical-mailbox {
    mailbox-type = "org.apache.pekko.dispatch.BoundedMailbox"
    mailbox-capacity = 5000
    mailbox-push-timeout-time = 3s
  }

  task-mailbox {
    mailbox-type = "org.apache.pekko.dispatch.BoundedMailbox"
    mailbox-capacity = 500
    mailbox-push-timeout-time = 3s
  }

  player-mailbox {
    mailbox-type = "org.apache.pekko.dispatch.BoundedMailbox"
    mailbox-capacity = 3000
    mailbox-push-timeout-time = 1s
  }
}
